<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đề Ôn Thi: Quản Trị Danh Mục Đầu Tư (100 Câu)</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --success: #22c55e;
      --success-soft: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, select {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      box-shadow: var(--shadow);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select, button {
      font-family: inherit;
      font-size: 0.875rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    select:focus, button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    button:hover {
      background: var(--surface-2);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger-soft);
    }

    .btn-active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 600;
    }

    /* Main layout */
    .container {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 16px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 20px;
      align-items: start;
    }

    .container > section {
      min-width: 0;
    }

    /* Mobile bottom bar & drawer (base) */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 55;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .drawer-handle {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .mobile-bar {
      display: none;
    }

    /* Toolbar */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Score banner */
    .result-banner {
      display: none;
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .result-banner.show {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .score-big {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }

    .score-details {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-neutral { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }

    /* Question card */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      scroll-margin-top: 84px;
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .q-num {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 10px;
      border-radius: 6px;
    }

    .q-section {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-flag {
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    .btn-flag.flagged {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: var(--warning);
      font-weight: 600;
    }

    .q-text {
      font-size: 1.02rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-key {
      font-weight: 700;
      min-width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      flex-shrink: 0;
    }

    .opt-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .opt-btn.selected .opt-key {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .opt-btn.correct {
      border-color: var(--success);
      background: var(--success-soft);
    }
    .opt-btn.correct .opt-key {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .opt-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
    }
    .opt-btn.wrong .opt-key {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .explanation {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--surface-2);
      border-left: 4px solid var(--primary);
      font-size: 0.9rem;
    }

    .explanation.exp-correct { border-left-color: var(--success); }
    .explanation.exp-wrong { border-left-color: var(--danger); }

    .single-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 12px;
    }

    /* Sidebar */
    .sidebar {
      position: sticky;
      top: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .stat-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .timer-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      margin-bottom: 14px;
      font-variant-numeric: tabular-nums;
    }

    .timer-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .timer-val.urgent {
      color: var(--danger);
    }

    .progress-bar {
      height: 8px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }

    .nav-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .q-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px;
    }

    .q-dot {
      position: relative;
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      text-align: center;
    }

    .q-dot.current {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .q-dot.answered {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .q-dot.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
    }

    .q-dot.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .q-dot.flagged::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 2px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warning);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dot-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    .empty-state {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .q-text, .opt-btn, .explanation {
      overflow-wrap: anywhere;
    }

    /* Responsive overrides (must come after base rules) */
    @media (max-width: 960px) {
      .container {
        grid-template-columns: minmax(0, 1fr);
        margin: 12px auto;
        padding: 0 12px calc(84px + env(safe-area-inset-bottom, 0px));
        gap: 12px;
      }

      .toolbar-group {
        width: 100%;
      }

      .toolbar-group select {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        text-overflow: ellipsis;
      }

      .sidebar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        z-index: 60;
        max-height: 82vh;
        overflow-y: auto;
        border-radius: 18px 18px 0 0;
        padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        transform: translateY(105%);
        visibility: hidden;
        pointer-events: none;
        transition: transform 0.25s ease, visibility 0.25s ease;
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
      }

      .sidebar.open {
        transform: translateY(0);
        visibility: visible;
        pointer-events: auto;
      }

      .q-grid {
        max-height: 40vh;
      }

      .single-nav {
        display: none !important;
      }

      .drawer-handle {
        display: flex;
      }

      .mobile-bar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
        box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.08);
      }

      .mobile-bar button {
        min-height: 42px;
        padding: 8px 12px;
        font-weight: 600;
      }

      .mobile-center-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--surface-2);
        font-size: 0.85rem;
        min-width: 0;
      }

      .mobile-timer-pill {
        background: var(--primary-soft);
        color: var(--primary);
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }

      .mobile-timer-pill.urgent {
        background: var(--danger-soft);
        color: var(--danger);
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 10px 12px;
      }

      .header-inner {
        gap: 8px;
      }

      .brand h1 {
        font-size: 0.96rem;
        line-height: 1.3;
      }

      .brand p {
        display: none;
      }

      .controls {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 6px;
      }

      .controls button {
        padding: 8px 10px;
        font-size: 0.82rem;
        text-align: center;
      }

      .toolbar {
        padding: 10px 12px;
        margin-bottom: 12px;
        gap: 8px;
      }

      .toolbar-group select {
        font-size: 0.92rem;
        padding: 9px 10px;
      }

      .toolbar-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        width: 100%;
      }

      .toolbar-actions button {
        padding: 9px 8px;
        font-size: 0.83rem;
        text-align: center;
      }

      .q-card {
        padding: 14px;
        margin-bottom: 12px;
      }

      .q-text {
        font-size: 0.98rem;
      }

      .opt-btn {
        min-height: 46px;
        padding: 11px 12px;
        font-size: 0.92rem;
      }

      .q-dot {
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>Đề Ôn Thi: Quản Trị Danh Mục Đầu Tư (100 Câu)</h1>
        <p>Lý thuyết &amp; Bài tập tính toán (Markowitz, CAPM, Sharpe, Duration...)</p>
      </div>
      <div class="controls">
        <button id="modePracticeBtn" class="btn-active" title="Hiện đáp án & giải thích ngay khi chọn">Chế độ Ôn tập</button>
        <button id="modeExamBtn" title="Làm bài có bấm giờ và chấm điểm khi nộp">Chế độ Thi thử</button>
        <button id="themeBtn" title="Đổi giao diện Sáng / Tối">🌙 Tối</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section>
      <div class="toolbar">
        <div class="toolbar-group">
          <select id="sectionFilter" aria-label="Lọc theo phần">
            <option value="ALL">Tất cả các phần (100 câu)</option>
          </select>
          <select id="statusFilter" aria-label="Lọc theo trạng thái">
            <option value="ALL">Tất cả trạng thái</option>
            <option value="UNANSWERED">Chưa làm</option>
            <option value="WRONG">Làm sai</option>
            <option value="FLAGGED">Đã đánh dấu ⭐</option>
          </select>
        </div>
        <div class="toolbar-group toolbar-actions">
          <button id="viewModeBtn">Xem: Từng câu</button>
          <button id="shuffleQBtn">🔀 Trộn câu</button>
          <button id="shuffleOptBtn">🎲 Trộn đáp án</button>
          <button id="resetBtn" class="btn-danger">↺ Làm lại</button>
        </div>
      </div>

      <div id="resultBanner" class="result-banner">
        <div>
          <div style="font-size:0.85rem;color:var(--text-muted);">KẾT QUẢ BÀI THI</div>
          <div class="score-big" id="scoreBig">0.00 / 10</div>
        </div>
        <div class="score-details" id="scoreDetails"></div>
      </div>

      <div id="questionArea"></div>

      <div id="singleNav" class="single-nav" style="display:none;">
        <button id="prevBtn">← Câu trước</button>
        <span id="singleCounter" style="font-size:0.9rem;color:var(--text-muted);"></span>
        <button id="nextBtn" class="btn-primary">Câu tiếp →</button>
      </div>
    </section>

    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <aside id="sidebar" class="sidebar">
      <div class="drawer-handle">
        <strong>Mục lục &amp; Tiến độ</strong>
        <button id="closeDrawerBtn" style="padding:4px 10px;">✕ Đóng</button>
      </div>
      <div id="timerBox" class="timer-box" style="display:none;">
        <div style="font-size:0.75rem;color:var(--text-muted);">THỜI GIAN CÒN LẠI</div>
        <div id="timerVal" class="timer-val">60:00</div>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val" id="statDone">0/100</div>
          <div class="stat-lbl">Đã làm</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statScore" style="color:var(--success)">0</div>
          <div class="stat-lbl">Đúng</div>
        </div>
      </div>

      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div id="examActionWrap" style="display:none;margin-bottom:14px;">
        <button id="submitExamBtn" class="btn-primary" style="width:100%;padding:10px;">Nộp bài &amp; Chấm điểm</button>
      </div>

      <div class="nav-title">
        <span>Danh sách câu hỏi</span>
        <span id="visibleCount" style="font-weight:400;color:var(--text-muted);font-size:0.78rem;"></span>
      </div>
      <div id="qGrid" class="q-grid"></div>

      <div class="legend">
        <span><i class="dot-swatch" style="background:var(--primary-soft);border:1px solid var(--primary)"></i> Đã chọn</span>
        <span><i class="dot-swatch" style="background:var(--success-soft);border:1px solid var(--success)"></i> Đúng</span>
        <span><i class="dot-swatch" style="background:var(--danger-soft);border:1px solid var(--danger)"></i> Sai</span>
        <span><i class="dot-swatch" style="background:var(--warning);border-radius:50%"></i> Đánh dấu</span>
      </div>
    </aside>
  </main>

  <div id="mobileBar" class="mobile-bar">
    <button id="mPrevBtn">← Trước</button>
    <button id="mDrawerBtn" class="mobile-center-btn">
      <span id="mCenterText">Mục lục (0/100)</span>
      <span id="mTimerPill" class="mobile-timer-pill" style="display:none;">60:00</span>
    </button>
    <button id="mNextBtn" class="btn-primary">Tiếp →</button>
  </div>

  <script>
    const RAW_QUESTIONS = [
  {
    "id": 1,
    "section": "Phần A. Khái niệm nền tảng",

    const STORAGE_KEY = "qtdmdt_exam_state_v1";
    const EXAM_DURATION_SEC = 60 * 60;

    let state = {
      mode: "practice", // "practice" | "exam"
      view: "single",   // "single" | "all"
      submitted: false,
      section: "ALL",
      statusFilter: "ALL",
      shuffleQ: false,
      shuffleOpt: false,
      qOrder: RAW_QUESTIONS.map(q => q.id),
      optOrders: {},    // { [qId]: ["A","B","C","D"] }
      answers: {},      // { [qId]: "A" } (original key)
      flags: {},        // { [qId]: true }
      currentIdx: 0,    // index in filtered list
      timeLeft: EXAM_DURATION_SEC,
      theme: "light"
    };

    let timerInterval = null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {}
      if (state.theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const qById = Object.fromEntries(RAW_QUESTIONS.map(q => [q.id, q]));

    function getDisplayOptions(q) {
      if (!state.shuffleOpt) {
        return ["A", "B", "C", "D"].map(k => ({ origKey: k, label: k, text: q.options[k] }));
      }
      if (!state.optOrders[q.id]) {
        state.optOrders[q.id] = shuffleArray(["A", "B", "C", "D"]);
      }
      const labels = ["A", "B", "C", "D"];
      return state.optOrders[q.id].map((origKey, idx) => ({
        origKey,
        label: labels[idx],
        text: q.options[origKey]
      }));
    }

    function getFilteredQuestions() {
      return state.qOrder
        .map(id => qById[id])
        .filter(q => {
          if (state.section !== "ALL" && q.section !== state.section) return false;
          const userAns = state.answers[q.id];
          const canReveal = state.mode === "practice" || state.submitted;
          if (state.statusFilter === "UNANSWERED" && userAns) return false;
          if (state.statusFilter === "WRONG" && (!canReveal || !userAns || userAns === q.answer)) return false;
          if (state.statusFilter === "FLAGGED" && !state.flags[q.id]) return false;
          return true;
        });
    }

    function populateSections() {
      const sel = document.getElementById("sectionFilter");
      const sections = [...new Set(RAW_QUESTIONS.map(q => q.section))];
      sections.forEach(s => {
        const count = RAW_QUESTIONS.filter(q => q.section === s).length;
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = `${s} (${count} câu)`;
        sel.appendChild(opt);
      });
      sel.value = state.section;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function syncTimer() {
      clearInterval(timerInterval);
      const timerBox = document.getElementById("timerBox");
      const timerVal = document.getElementById("timerVal");
      const mTimerPill = document.getElementById("mTimerPill");
      if (state.mode === "exam") {
        timerBox.style.display = "block";
        mTimerPill.style.display = "inline-block";
        const updateTimerText = () => {
          const t = formatTime(state.timeLeft);
          const urgent = state.timeLeft <= 300;
          timerVal.textContent = t;
          timerVal.classList.toggle("urgent", urgent);
          mTimerPill.textContent = t;
          mTimerPill.classList.toggle("urgent", urgent);
        };
        updateTimerText();
        if (!state.submitted) {
          timerInterval = setInterval(() => {
            if (state.timeLeft > 0) {
              state.timeLeft--;
              updateTimerText();
              if (state.timeLeft % 5 === 0) saveState();
            } else {
              clearInterval(timerInterval);
              submitExam(true);
            }
          }, 1000);
        }
      } else {
        timerBox.style.display = "none";
        mTimerPill.style.display = "none";
      }
    }

    function submitExam(auto = false) {
      state.submitted = true;
      clearInterval(timerInterval);
      saveState();
      render();
      if (auto) {
        alert("Hết thời gian! Hệ thống đã tự động nộp bài.");
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestionCard(q, indexInList) {
      const card = document.createElement("article");
      card.className = "q-card";
      card.id = `q-${q.id}`;

      const userAns = state.answers[q.id];
      const reveal = (state.mode === "practice" && !!userAns) || (state.mode === "exam" && state.submitted);
      const isCorrect = userAns === q.answer;
      const flagged = !!state.flags[q.id];

      const header = document.createElement("div");
      header.className = "q-header";
      header.innerHTML = `
        <div class="q-meta">
          <span class="q-num">Câu ${q.id}</span>
          <span class="q-section">${q.section}</span>
        </div>
      `;

      const flagBtn = document.createElement("button");
      flagBtn.className = `btn-flag ${flagged ? "flagged" : ""}`;
      flagBtn.textContent = flagged ? "★ Đã đánh dấu" : "☆ Đánh dấu";
      flagBtn.onclick = () => {
        if (state.flags[q.id]) delete state.flags[q.id];
        else state.flags[q.id] = true;
        saveState();
        render();
      };
      header.appendChild(flagBtn);
      card.appendChild(header);

      const qText = document.createElement("div");
      qText.className = "q-text";
      qText.textContent = q.question;
      card.appendChild(qText);

      const optsWrap = document.createElement("div");
      optsWrap.className = "options";
      const displayOpts = getDisplayOptions(q);
      let correctDisplayLabel = q.answer;

      displayOpts.forEach(opt => {
        if (opt.origKey === q.answer) correctDisplayLabel = opt.label;
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        if (reveal) {
          btn.disabled = true;
          if (opt.origKey === q.answer) btn.classList.add("correct");
          else if (opt.origKey === userAns) btn.classList.add("wrong");
        } else if (opt.origKey === userAns) {
          btn.classList.add("selected");
        }

        btn.innerHTML = `<span class="opt-key">${opt.label}</span><span>${opt.text}</span>`;
        btn.onclick = () => {
          if (state.mode === "exam" && state.submitted) return;
          if (state.mode === "practice" && state.answers[q.id]) return;
          state.answers[q.id] = opt.origKey;
          saveState();
          render();
        };
        optsWrap.appendChild(btn);
      });
      card.appendChild(optsWrap);

      if (reveal) {
        const exp = document.createElement("div");
        exp.className = `explanation ${userAns ? (isCorrect ? "exp-correct" : "exp-wrong") : ""}`;
        const statusText = !userAns
          ? `Chưa trả lời — Đáp án đúng: <strong>${correctDisplayLabel}</strong>`
          : isCorrect
            ? `✓ Chính xác! Đáp án: <strong>${correctDisplayLabel}</strong>`
            : `✕ Chưa đúng. Đáp án đúng: <strong>${correctDisplayLabel}</strong>`;
        exp.innerHTML = `<div>${statusText}</div><div style="margin-top:4px;"><strong>Giải thích:</strong> ${q.explanation}</div>`;
        card.appendChild(exp);
      }

      return card;
    }

    function render() {
      // Header buttons
      document.getElementById("modePracticeBtn").className = state.mode === "practice" ? "btn-active" : "";
      document.getElementById("modeExamBtn").className = state.mode === "exam" ? "btn-active" : "";
      document.getElementById("themeBtn").textContent = state.theme === "dark" ? "☀️ Sáng" : "🌙 Tối";
      document.getElementById("viewModeBtn").textContent = state.view === "single" ? "Xem: Từng câu" : "Xem: Tất cả";
      document.getElementById("shuffleQBtn").className = state.shuffleQ ? "btn-active" : "";
      document.getElementById("shuffleOptBtn").className = state.shuffleOpt ? "btn-active" : "";
      document.getElementById("sectionFilter").value = state.section;
      document.getElementById("statusFilter").value = state.statusFilter;

      const filtered = getFilteredQuestions();
      if (state.currentIdx >= filtered.length) state.currentIdx = Math.max(0, filtered.length - 1);

      // Stats
      const total = RAW_QUESTIONS.length;
      const doneCount = Object.keys(state.answers).length;
      const canRevealAll = state.mode === "practice" || state.submitted;
      const correctCount = RAW_QUESTIONS.filter(q => state.answers[q.id] === q.answer).length;
      const wrongCount = RAW_QUESTIONS.filter(q => state.answers[q.id] && state.answers[q.id] !== q.answer).length;

      document.getElementById("statDone").textContent = `${doneCount}/${total}`;
      document.getElementById("statScore").textContent = canRevealAll ? `${correctCount}` : "—";
      document.getElementById("progressFill").style.width = `${(doneCount / total) * 100}%`;
      document.getElementById("visibleCount").textContent = `${filtered.length} câu`;

      // Exam submit & result banner
      const examWrap = document.getElementById("examActionWrap");
      const banner = document.getElementById("resultBanner");
      if (state.mode === "exam" && !state.submitted) {
        examWrap.style.display = "block";
        banner.classList.remove("show");
      } else if (state.mode === "exam" && state.submitted) {
        examWrap.style.display = "none";
        banner.classList.add("show");
        const score10 = ((correctCount / total) * 10).toFixed(2);
        document.getElementById("scoreBig").textContent = `${score10} / 10`;
        document.getElementById("scoreDetails").innerHTML = `
          <span class="badge badge-success">Đúng: ${correctCount}</span>
          <span class="badge badge-danger">Sai: ${wrongCount}</span>
          <span class="badge badge-neutral">Bỏ trống: ${total - doneCount}</span>
        `;
      } else {
        examWrap.style.display = "none";
        banner.classList.remove("show");
      }

      // Questions area
      const qArea = document.getElementById("questionArea");
      const singleNav = document.getElementById("singleNav");
      qArea.innerHTML = "";

      if (filtered.length === 0) {
        singleNav.style.display = "none";
        qArea.innerHTML = `<div class="empty-state">Không có câu hỏi nào phù hợp với bộ lọc hiện tại.</div>`;
      } else if (state.view === "single") {
        const currentQ = filtered[state.currentIdx];
        qArea.appendChild(renderQuestionCard(currentQ, state.currentIdx));
        singleNav.style.display = "flex";
        document.getElementById("prevBtn").disabled = state.currentIdx === 0;
        document.getElementById("nextBtn").disabled = state.currentIdx === filtered.length - 1;
        document.getElementById("singleCounter").textContent = `${state.currentIdx + 1} / ${filtered.length}`;
      } else {
        singleNav.style.display = "none";
        filtered.forEach((q, idx) => qArea.appendChild(renderQuestionCard(q, idx)));
      }

      // Mobile bottom bar state
      const mPrev = document.getElementById("mPrevBtn");
      const mNext = document.getElementById("mNextBtn");
      const mCenter = document.getElementById("mCenterText");
      if (state.view === "single" && filtered.length > 0) {
        mPrev.style.visibility = "visible";
        mNext.style.visibility = "visible";
        mPrev.disabled = state.currentIdx === 0;
        mNext.disabled = state.currentIdx === filtered.length - 1;
        mCenter.textContent = `Câu ${state.currentIdx + 1}/${filtered.length} • ☰`;
      } else {
        mPrev.style.visibility = "hidden";
        mNext.style.visibility = "hidden";
        mCenter.textContent = `Mục lục (${doneCount}/${total})`;
      }

      // Sidebar Grid
      const grid = document.getElementById("qGrid");
      grid.innerHTML = "";
      filtered.forEach((q, idx) => {
        const dot = document.createElement("button");
        dot.className = "q-dot";
        dot.textContent = q.id;
        const userAns = state.answers[q.id];
        const reveal = (state.mode === "practice" && !!userAns) || (state.mode === "exam" && state.submitted);
        if (reveal) {
          if (userAns === q.answer) dot.classList.add("correct");
          else if (userAns) dot.classList.add("wrong");
        } else if (userAns) {
          dot.classList.add("answered");
        }
        if (state.flags[q.id]) dot.classList.add("flagged");
        if (state.view === "single" && idx === state.currentIdx) dot.classList.add("current");

        dot.onclick = () => {
          closeDrawer();
          if (state.view === "single") {
            state.currentIdx = idx;
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          } else {
            document.getElementById(`q-${q.id}`)?.scrollIntoView({ behavior: "smooth" });
          }
        };
        grid.appendChild(dot);
      });
    }

    // Event listeners
    document.getElementById("modePracticeBtn").onclick = () => {
      state.mode = "practice";
      syncTimer();
      saveState();
      render();
    };

    document.getElementById("modeExamBtn").onclick = () => {
      state.mode = "exam";
      syncTimer();
      saveState();
      render();
    };

    document.getElementById("themeBtn").onclick = () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", state.theme);
      saveState();
      render();
    };

    document.getElementById("sectionFilter").onchange = (e) => {
      state.section = e.target.value;
      state.currentIdx = 0;
      saveState();
      render();
    };

    document.getElementById("statusFilter").onchange = (e) => {
      state.statusFilter = e.target.value;
      state.currentIdx = 0;
      saveState();
      render();
    };

    document.getElementById("viewModeBtn").onclick = () => {
      state.view = state.view === "single" ? "all" : "single";
      saveState();
      render();
    };

    document.getElementById("shuffleQBtn").onclick = () => {
      state.shuffleQ = !state.shuffleQ;
      state.qOrder = state.shuffleQ
        ? shuffleArray(RAW_QUESTIONS.map(q => q.id))
        : RAW_QUESTIONS.map(q => q.id);
      state.currentIdx = 0;
      saveState();
      render();
    };

    document.getElementById("shuffleOptBtn").onclick = () => {
      state.shuffleOpt = !state.shuffleOpt;
      state.optOrders = {};
      saveState();
      render();
    };

    document.getElementById("resetBtn").onclick = () => {
      if (!confirm("Bạn có chắc muốn xóa toàn bộ đáp án đã chọn và làm lại từ đầu?")) return;
      state.answers = {};
      state.flags = {};
      state.submitted = false;
      state.timeLeft = EXAM_DURATION_SEC;
      state.currentIdx = 0;
      syncTimer();
      saveState();
      render();
    };

    function openDrawer() {
      document.getElementById("sidebar").classList.add("open");
      document.getElementById("drawerBackdrop").classList.add("open");
    }

    function closeDrawer() {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("drawerBackdrop").classList.remove("open");
    }

    document.getElementById("mDrawerBtn").onclick = openDrawer;
    document.getElementById("closeDrawerBtn").onclick = closeDrawer;
    document.getElementById("drawerBackdrop").onclick = closeDrawer;
    document.getElementById("mPrevBtn").onclick = () => document.getElementById("prevBtn").click();
    document.getElementById("mNextBtn").onclick = () => document.getElementById("nextBtn").click();

    document.getElementById("submitExamBtn").onclick = () => {
      const doneCount = Object.keys(state.answers).length;
      const msg = doneCount < 100
        ? `Bạn mới làm ${doneCount}/100 câu. Bạn có chắc chắn muốn nộp bài?`
        : "Xác nhận nộp bài và chấm điểm?";
      if (confirm(msg)) {
        closeDrawer();
        submitExam(false);
      }
    };

    document.getElementById("prevBtn").onclick = () => {
      if (state.currentIdx > 0) {
        state.currentIdx--;
        saveState();
        render();
      }
    };

    document.getElementById("nextBtn").onclick = () => {
      const filtered = getFilteredQuestions();
      if (state.currentIdx < filtered.length - 1) {
        state.currentIdx++;
        saveState();
        render();
      }
    };

    document.addEventListener("keydown", (e) => {
      if (state.view !== "single") return;
      if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
      if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
    });

    // Touch swipe navigation on mobile in single-question mode
    let touchStartX = 0;
    let touchStartY = 0;
    const qAreaEl = document.getElementById("questionArea");
    qAreaEl.addEventListener("touchstart", (e) => {
      if (e.changedTouches.length !== 1) return;
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    qAreaEl.addEventListener("touchend", (e) => {
      if (state.view !== "single" || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) document.getElementById("nextBtn").click();
        else document.getElementById("prevBtn").click();
      }
    }, { passive: true });

    loadState();
    populateSections();
    syncTimer();
    render();
  </script>
</body>
</html>
